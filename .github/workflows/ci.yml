name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # Electron's type definitions are all the checks need; the binary is only fetched on first
      # use, which never happens here.
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

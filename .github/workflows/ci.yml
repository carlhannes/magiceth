name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
        # The checks need Electron's type definitions, not its 100 MB binary.
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npx prettier --check .
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
